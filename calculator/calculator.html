<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1f26;
    font-family: system-ui, sans-serif;
  }
  .calc {
    width: 320px;
    background: #2a2b34;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .display {
    background: #1a1b21;
    color: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
  }
  .prev { color: #8b8d9a; font-size: 1rem; min-height: 1.2em; }
  .curr { font-size: 2.2rem; font-weight: 600; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    padding: 18px 0;
    font-size: 1.2rem;
    border: none;
    border-radius: 12px;
    background: #3a3b47;
    color: #fff;
    cursor: pointer;
    transition: transform .08s, background .15s;
  }
  button:hover { background: #4a4b5a; }
  button:active { transform: scale(.95); }
  .op { background: #ff9f1c; }
  .op:hover { background: #ffb347; }
  .clear { background: #e63946; }
  .clear:hover { background: #ef5b66; }
  .equal { background: #2ec4b6; grid-column: span 2; }
  .equal:hover { background: #4fd6ca; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <div class="keys">
    <button class="clear" data-action="clear">AC</button>
    <button data-action="delete">⌫</button>
    <button class="op" data-op="%">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equal" data-action="equals">=</button>
  </div>
</div>

<script>
  const currEl = document.getElementById('curr');
  const prevEl = document.getElementById('prev');
  const symbols = { '/': '÷', '*': '×', '-': '−', '+': '+', '%': '%' };

  let current = '0', previous = '', operator = null, justEvaluated = false;

  function update() {
    currEl.textContent = current;
    prevEl.textContent = operator ? `${previous} ${symbols[operator]}` : '';
  }

  function appendNumber(n) {
    if (justEvaluated) { current = '0'; justEvaluated = false; }
    if (n === '.' && current.includes('.')) return;
    current = (current === '0' && n !== '.') ? n : current + n;
    update();
  }

  function chooseOp(op) {
    if (operator && !justEvaluated) compute();
    operator = op;
    previous = current;
    current = '0';
    justEvaluated = false;
    update();
  }

  function compute() {
    if (!operator) return;
    const a = parseFloat(previous), b = parseFloat(current);
    let r;
    switch (operator) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': r = b === 0 ? 'Error' : a / b; break;
      case '%': r = a % b; break;
    }
    current = r === 'Error' ? r : String(Math.round(r * 1e10) / 1e10);
    operator = null;
    previous = '';
    justEvaluated = true;
  }

  function clearAll() { current = '0'; previous = ''; operator = null; justEvaluated = false; update(); }

  function del() {
    if (justEvaluated || current === 'Error') return clearAll();
    current = current.length > 1 ? current.slice(0, -1) : '0';
    update();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (current === 'Error') clearAll();
    if (b.dataset.num !== undefined) appendNumber(b.dataset.num);
    else if (b.dataset.op) chooseOp(b.dataset.op);
    else if (b.dataset.action === 'clear') clearAll();
    else if (b.dataset.action === 'delete') del();
    else if (b.dataset.action === 'equals') { compute(); update(); }
  });

  document.addEventListener('keydown', e => {
    if (/[0-9.]/.test(e.key)) appendNumber(e.key);
    else if (['+', '-', '*', '/', '%'].includes(e.key)) chooseOp(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); compute(); update(); }
    else if (e.key === 'Backspace') del();
    else if (e.key === 'Escape') clearAll();
  });
</script>
</body>
</html>
